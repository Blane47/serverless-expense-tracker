AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  Serverless Expense Tracker backend.
  Defines four SAM-managed Lambda CRUD functions,
  centralized CloudWatch logging, operational alarms,
  and SNS email notifications.

Parameters:
  ExpenseTableName:
    Type: String
    Default: expense-tracker
    Description: Name of the existing DynamoDB expense table.

  AlarmEmail:
    Type: String
    NoEcho: true
    Description: Email address that receives CloudWatch alarm notifications.

Globals:
  Function:
    Runtime: nodejs22.x

    Architectures:
      - x86_64

    MemorySize: 128
    Timeout: 10

    Environment:
      Variables:
        TABLE_NAME: !Ref ExpenseTableName

    LoggingConfig:
      LogFormat: JSON
      LogGroup: !Ref ExpenseTrackerLogGroup

    Tags:
      Project: serverless-expense-tracker
      ManagedBy: AWS-SAM


Resources:

  # ==================================================
  # CLOUDWATCH LOGGING
  # ==================================================

  ExpenseTrackerLogGroup:
    Type: AWS::Logs::LogGroup

    Properties:
      LogGroupName: !Sub "/expense-tracker/${AWS::StackName}"
      RetentionInDays: 14


  # ==================================================
  # SNS NOTIFICATIONS
  # ==================================================

  ExpenseTrackerAlarmTopic:
    Type: AWS::SNS::Topic

    Properties:
      TopicName: !Sub "${AWS::StackName}-alarms"
      DisplayName: Expense Tracker Alerts

      Tags:
        - Key: Project
          Value: serverless-expense-tracker
        - Key: ManagedBy
          Value: AWS-SAM


  ExpenseTrackerEmailSubscription:
    Type: AWS::SNS::Subscription

    Properties:
      Protocol: email
      Endpoint: !Ref AlarmEmail
      TopicArn: !Ref ExpenseTrackerAlarmTopic


  # ==================================================
  # CREATE EXPENSE
  # ==================================================

  CreateExpenseFunction:
    Type: AWS::Serverless::Function

    DependsOn:
      - ExpenseTrackerLogGroup

    Properties:
      Description: >
        Creates an expense for the authenticated user.

      CodeUri: functions/createExpense/
      Handler: index.handler

      Policies:
        - Statement:
            - Sid: AllowCreateExpense
              Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource:
                !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExpenseTableName}


  # ==================================================
  # GET EXPENSES
  # ==================================================

  GetExpensesFunction:
    Type: AWS::Serverless::Function

    DependsOn:
      - ExpenseTrackerLogGroup

    Properties:
      Description: >
        Retrieves expenses belonging to the authenticated user.

      CodeUri: functions/getExpenses/
      Handler: index.handler

      Policies:
        - Statement:
            - Sid: AllowGetExpenses
              Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExpenseTableName}


  # ==================================================
  # UPDATE EXPENSE
  # ==================================================

  UpdateExpenseFunction:
    Type: AWS::Serverless::Function

    DependsOn:
      - ExpenseTrackerLogGroup

    Properties:
      Description: >
        Updates an existing expense belonging to the authenticated user.

      CodeUri: functions/updateExpense/
      Handler: index.handler

      Policies:
        - Statement:
            - Sid: AllowUpdateExpense
              Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource:
                !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExpenseTableName}


  # ==================================================
  # DELETE EXPENSE
  # ==================================================

  DeleteExpenseFunction:
    Type: AWS::Serverless::Function

    DependsOn:
      - ExpenseTrackerLogGroup

    Properties:
      Description: >
        Deletes an expense belonging to the authenticated user.

      CodeUri: functions/deleteExpense/
      Handler: index.handler

      Policies:
        - Statement:
            - Sid: AllowDeleteExpense
              Effect: Allow
              Action:
                - dynamodb:DeleteItem
              Resource:
                !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExpenseTableName}


  # ==================================================
  # CREATE EXPENSE ALARMS
  # ==================================================

  CreateExpenseErrorsAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:
      AlarmName: !Sub "${AWS::StackName}-CreateExpense-Errors"

      AlarmDescription: >
        Triggers when CreateExpense reports one or more
        Lambda errors during a five-minute period.

      Namespace: AWS/Lambda
      MetricName: Errors

      Dimensions:
        - Name: FunctionName
          Value: !Ref CreateExpenseFunction

      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1

      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

      AlarmActions:
        - !Ref ExpenseTrackerAlarmTopic

      OKActions:
        - !Ref ExpenseTrackerAlarmTopic


  CreateExpenseThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:
      AlarmName: !Sub "${AWS::StackName}-CreateExpense-Throttles"

      AlarmDescription: >
        Triggers when the CreateExpense Lambda is throttled.

      Namespace: AWS/Lambda
      MetricName: Throttles

      Dimensions:
        - Name: FunctionName
          Value: !Ref CreateExpenseFunction

      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1

      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

      AlarmActions:
        - !Ref ExpenseTrackerAlarmTopic

      OKActions:
        - !Ref ExpenseTrackerAlarmTopic


  # ==================================================
  # GET EXPENSES ALARMS
  # ==================================================

  GetExpensesErrorsAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:
      AlarmName: !Sub "${AWS::StackName}-GetExpenses-Errors"

      AlarmDescription: >
        Triggers when GetExpenses reports one or more
        Lambda errors during a five-minute period.

      Namespace: AWS/Lambda
      MetricName: Errors

      Dimensions:
        - Name: FunctionName
          Value: !Ref GetExpensesFunction

      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1

      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

      AlarmActions:
        - !Ref ExpenseTrackerAlarmTopic

      OKActions:
        - !Ref ExpenseTrackerAlarmTopic


  GetExpensesThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:
      AlarmName: !Sub "${AWS::StackName}-GetExpenses-Throttles"

      AlarmDescription: >
        Triggers when the GetExpenses Lambda is throttled.

      Namespace: AWS/Lambda
      MetricName: Throttles

      Dimensions:
        - Name: FunctionName
          Value: !Ref GetExpensesFunction

      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1

      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

      AlarmActions:
        - !Ref ExpenseTrackerAlarmTopic

      OKActions:
        - !Ref ExpenseTrackerAlarmTopic


  # ==================================================
  # UPDATE EXPENSE ALARMS
  # ==================================================

  UpdateExpenseErrorsAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:
      AlarmName: !Sub "${AWS::StackName}-UpdateExpense-Errors"

      AlarmDescription: >
        Triggers when UpdateExpense reports one or more
        Lambda errors during a five-minute period.

      Namespace: AWS/Lambda
      MetricName: Errors

      Dimensions:
        - Name: FunctionName
          Value: !Ref UpdateExpenseFunction

      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1

      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

      AlarmActions:
        - !Ref ExpenseTrackerAlarmTopic

      OKActions:
        - !Ref ExpenseTrackerAlarmTopic


  UpdateExpenseThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:
      AlarmName: !Sub "${AWS::StackName}-UpdateExpense-Throttles"

      AlarmDescription: >
        Triggers when the UpdateExpense Lambda is throttled.

      Namespace: AWS/Lambda
      MetricName: Throttles

      Dimensions:
        - Name: FunctionName
          Value: !Ref UpdateExpenseFunction

      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1

      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

      AlarmActions:
        - !Ref ExpenseTrackerAlarmTopic

      OKActions:
        - !Ref ExpenseTrackerAlarmTopic


  # ==================================================
  # DELETE EXPENSE ALARMS
  # ==================================================

  DeleteExpenseErrorsAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:
      AlarmName: !Sub "${AWS::StackName}-DeleteExpense-Errors"

      AlarmDescription: >
        Triggers when DeleteExpense reports one or more
        Lambda errors during a five-minute period.

      Namespace: AWS/Lambda
      MetricName: Errors

      Dimensions:
        - Name: FunctionName
          Value: !Ref DeleteExpenseFunction

      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1

      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

      AlarmActions:
        - !Ref ExpenseTrackerAlarmTopic

      OKActions:
        - !Ref ExpenseTrackerAlarmTopic


  DeleteExpenseThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:
      AlarmName: !Sub "${AWS::StackName}-DeleteExpense-Throttles"

      AlarmDescription: >
        Triggers when the DeleteExpense Lambda is throttled.

      Namespace: AWS/Lambda
      MetricName: Throttles

      Dimensions:
        - Name: FunctionName
          Value: !Ref DeleteExpenseFunction

      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1

      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

      AlarmActions:
        - !Ref ExpenseTrackerAlarmTopic

      OKActions:
        - !Ref ExpenseTrackerAlarmTopic


Outputs:

  CreateExpenseFunctionArn:
    Description: ARN of the SAM-managed createExpense Lambda function.
    Value: !GetAtt CreateExpenseFunction.Arn

  GetExpensesFunctionArn:
    Description: ARN of the SAM-managed getExpenses Lambda function.
    Value: !GetAtt GetExpensesFunction.Arn

  UpdateExpenseFunctionArn:
    Description: ARN of the SAM-managed updateExpense Lambda function.
    Value: !GetAtt UpdateExpenseFunction.Arn

  DeleteExpenseFunctionArn:
    Description: ARN of the SAM-managed deleteExpense Lambda function.
    Value: !GetAtt DeleteExpenseFunction.Arn

  ExpenseTable:
    Description: Existing DynamoDB table used by the backend.
    Value: !Ref ExpenseTableName

  ExpenseTrackerLogGroupName:
    Description: Central CloudWatch log group for the Expense Tracker backend.
    Value: !Ref ExpenseTrackerLogGroup

  ExpenseTrackerAlarmTopicArn:
    Description: SNS topic used for backend monitoring alerts.
    Value: !Ref ExpenseTrackerAlarmTopic