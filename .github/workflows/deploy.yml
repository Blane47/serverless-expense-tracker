name: Deploy Expense Tracker Frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_COGNITO_AUTHORITY: ${{ vars.VITE_COGNITO_AUTHORITY }}
      VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify production build
        run: |
          test -f dist/index.html

          if grep -R "localhost:5173" dist; then
            echo "ERROR: Production build contains localhost:5173"
            exit 1
          fi

          echo "Production build verification passed."

      - name: Inspect GitHub OIDC claims
        shell: bash
        run: |
          RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | python -c "import sys,json; print(json.load(sys.stdin)['value'])")

          export TOKEN

          python <<'PY'
          import os
          import json
          import base64

          token = os.environ["TOKEN"]
          payload = token.split(".")[1]

          payload += "=" * (-len(payload) % 4)
          payload = payload.replace("-", "+").replace("_", "/")

          claims = json.loads(
              base64.b64decode(payload).decode("utf-8")
          )

          print("==========================================")
          print("GITHUB OIDC CLAIMS")
          print("==========================================")
          print("sub:", claims.get("sub"))
          print("aud:", claims.get("aud"))
          print("repository:", claims.get("repository"))
          print("repository_owner:", claims.get("repository_owner"))
          print("ref:", claims.get("ref"))
          print("event_name:", claims.get("event_name"))
          print("workflow:", claims.get("workflow"))
          print("==========================================")
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::109719059036:role/ExpenseTrackerDeployPolicy
          role-session-name: GitHubActionsExpenseTracker
          aws-region: eu-north-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy files to S3
        run: |
          aws s3 sync dist/ \
            s3://expense-tracker-frontend-109719059036 \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E328QFVJ5SAE7H \
            --paths "/*"

      - name: Deployment complete
        run: |
          echo "Expense Tracker deployment completed successfully."
          echo "https://d1140sv45cs8l5.cloudfront.net/"
