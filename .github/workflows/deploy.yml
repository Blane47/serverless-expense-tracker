name: Deploy Expense Tracker Frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_COGNITO_AUTHORITY: ${{ vars.VITE_COGNITO_AUTHORITY }}
      VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify production build
        run: |
          test -f dist/index.html

          if grep -R "localhost:5173" dist; then
            echo "ERROR: Production build contains localhost:5173"
            exit 1
          fi

          echo "Production build verification passed."

      - name: Debug GitHub OIDC claims
        uses: github/actions-oidc-debugger@main
        with:
          audience: sts.amazonaws.com

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::109719059036:role/ExpenseTrackerDeployPolicy
          aws-region: eu-north-1

      - name: Deploy files to S3
        run: |
          aws s3 sync dist/ \
            s3://expense-tracker-frontend-109719059036 \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E328QFVJ5SAE7H \
            --paths "/*"

      - name: Deployment complete
        run: |
          echo "Expense Tracker deployment completed successfully."
          echo "https://d1140sv45cs8l5.cloudfront.net/"
