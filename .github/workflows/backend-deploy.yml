name: Deploy Expense Tracker Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Validate SAM template
        run: sam validate

      - name: Build SAM application
        run: sam build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::109719059036:role/ExpenseTrackerBackendDeployRole
          role-session-name: GitHubActionsExpenseTrackerBackend
          aws-region: eu-north-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy SAM application
        run: |
          sam deploy \
            --stack-name expense-tracker-backend \
            --region eu-north-1 \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides ExpenseTableName=expense-tracker \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Show deployed Lambda functions
        run: |
          aws cloudformation describe-stack-resources \
            --region eu-north-1 \
            --stack-name expense-tracker-backend \
            --query "StackResources[?ResourceType=='AWS::Lambda::Function'].[LogicalResourceId,PhysicalResourceId]" \
            --output table

      - name: Deployment complete
        run: |
          echo "Expense Tracker backend deployment completed successfully."